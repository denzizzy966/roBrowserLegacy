<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<title>Autochess — Arena</title>
	<style>
		/* Tanpa color di body: jendela RO bawaan (WinPopup kotak pesan)
		   mewarisinya lewat Shadow DOM dan teks hitamnya jadi abu-abu pudar
		   di atas latar putih. Warna terang hanya untuk #log dan #ui. */
		html, body { margin: 0; height: 100%; background: #111;
		             font-family: ui-monospace, monospace; }
		#log, #ui { color: #ddd; }
		/* #log (AC4 Q9): tersembunyi bawaan (style inline), dibuka tombol Log
		   di InfoPemain. Kecil di kiri-bawah, di kanan InfoPemain (lebar 200) dan
		   di atas Bangku, dengan z-index 10 < 50 milik host jendela RO:
		   jendela selalu di atasnya dan tetap bisa diklik. */
		#log { position: fixed; left: 216px; bottom: 126px; width: min(480px, calc(100vw - 470px));
		       max-height: 160px; box-sizing: border-box;
		       overflow: auto; white-space: pre-wrap; background: rgba(0,0,0,.75);
		       padding: .5rem; font-size: 12px; z-index: 10; }
		/* Panel catur AC3 (ui.js), kini panel debug: tersembunyi bawaan,
		   __ac.debug(true) menampilkannya. Kanan, bergulir, polos. */
		#ui { position: fixed; top: 0; right: 0; bottom: 0; width: 360px;
		      overflow-y: auto; background: rgba(0,0,0,.8); color: #ddd;
		      font-size: 12px; padding: 8px; z-index: 100; box-sizing: content-box; }
		#ui section { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 6px; }
		#ui h3 { margin: 0 0 4px; font-size: 12px; color: #fc6; }
		#ui table { width: 100%; border-collapse: collapse; }
		#ui th, #ui td { text-align: left; padding: 1px 3px; }
		#ui tr.saya { color: #6cf; }
		#ui tr.tersingkir { color: #777; text-decoration: line-through; }
		#ui .kartu { padding: 2px 0; }
		#ui .kosong { color: #666; }
		#ui button, #ui select { font: inherit; margin-left: 2px; }
		#ui button[disabled] { opacity: .4; }
		#ui #hasil, #ui #selesai { color: #fff; }
	</style>
	<script>
		// Configs.js mengisi dirinya dari window.ROConfig lewat IIFE saat
		// modulnya diimpor, jadi ini HARUS berjalan sebelum <script type="module">
		// di bawah. 'api' sengaja tidak disetel: nilainya harus falsy agar
		// jalur pemilih berkas Intro yang dipakai, bukan jalur postMessage.
		window.ROConfig = {
			development: true,
			BGMFileExtension: ['mp3']
		};
	</script>
</head>
<body>
	<div id="log" style="display: none"></div>
	<div id="ui" style="display: none"></div>
	<script type="module" src="./main.js"></script>
</body>
</html>
